<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Direction 02 — Ignition</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    body { background: #080e1d; color: #f8f4ec; }
    .ignition {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 74% 38%, rgba(255, 204, 5, .11), transparent 24%),
        radial-gradient(circle at 27% 72%, rgba(20, 120, 185, .18), transparent 30%),
        linear-gradient(135deg, #071020 0%, #10172b 53%, #080c18 100%);
    }
    .ignition::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .23;
      background-image: radial-gradient(rgba(255,255,255,.75) .65px, transparent .65px);
      background-size: 26px 26px;
      mask-image: linear-gradient(to bottom, transparent, #000 24%, #000 78%, transparent);
    }
    .beam {
      position: absolute;
      left: -15vw;
      top: 57%;
      width: 130vw;
      height: clamp(2px, .35vw, 5px);
      rotate: -8deg;
      background: linear-gradient(90deg, transparent 3%, var(--blue) 28%, #fff 48%, var(--yellow) 62%, var(--red) 78%, transparent 96%);
      box-shadow: 0 0 22px rgba(255,255,255,.38), 0 0 80px rgba(255,204,5,.2);
    }
    .beam::before {
      content: "";
      position: absolute;
      left: 68%;
      top: 50%;
      width: 18px;
      aspect-ratio: 1;
      translate: -50% -50%;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 0 12px rgba(255,204,5,.12), 0 0 65px 25px rgba(255,204,5,.38);
    }
    .flare {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(58vw, 760px);
      aspect-ratio: 1;
      translate: -50% -50%;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 50%;
      box-shadow: inset 0 0 90px rgba(20,120,185,.08), 0 0 120px rgba(202,45,36,.06);
    }
    .content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: min(88vw, 1200px);
    }
    .content .eyebrow { color: #ffd74a; }
    .content .brand-logo {
      width: min(72vw, 960px);
      filter: drop-shadow(0 24px 45px rgba(0,0,0,.45));
    }
    @media (max-width: 640px) {
      .beam { left: -55vw; width: 210vw; top: 58%; rotate: -18deg; }
      .flare { width: 118vw; }
      .content { width: 100%; gap: 20px; transform: translateY(-3vh); }
      .content .brand-logo { width: 80vw; max-width: none; }
      .content .eyebrow { font-size: 9px; }
    }
  </style>
</head>
<body>
  <main class="entry-frame ignition" aria-label="Ignition entry animation concept">
    <div class="flare" aria-hidden="true"></div>
    <div class="beam" aria-hidden="true"></div>
    <section class="content">
      <p class="eyebrow">Igniting student ambition</p>
      <img class="brand-logo" src="../out/logo-transparent.png" alt="Galgotias Entrepreneurship Cell" />
    </section>
  </main>
</body>
</html>
